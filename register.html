       <div class="container-fluid">
           <a class="navbar-brand" href="index.html">Магазин одежды "LIRA"</a>

                      </ul>

       </div>

<main>
  <div class="container py-5">
    <form class="row g-3" id="registrationForm">
      <div class="col-md-4">
        <label for="validationDefault01" class="form-label">Имя</label>
        <input type="text" class="form-control" id="validationDefault01" value="" required>
     </div>

            <div class="col-md-4">
                <label for="validationDefault02" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="validationDefault02" value="" required>
            </div>

            <div class="col-md-4">
                <label for="validationDefaultUsername" class="form-label">Электронный адрес</label>
                <div class="input-group">
                <span class="input-group-text" id="inputGroupPrepend2">@</span>
                <input type="text" class="form-control" id="validationDefaultUsername" aria-describedby="inputGroupPrepend2" required>
                </div>
            </div>

            <div class="col-md-12">
                <label for="validationDefault03" class="form-label">Город</label>
                <input type="text" class="form-control" id="validationDefault03" required>
            </div>

             <div class="col-md-6">
                    <label for="userPassword" class="form-label">Пароль</label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="userPassword" 
                            class="form-control" 
                            placeholder="Введите пароль"
                        >
                        <button 
                            class="btn btn-outline-secondary" 
                            type="button" 
                            id="togglePasswordBtn"
                            >
                            👁️
                        </button>
                    </div>
             </div>

             <div class="col-md-6"> 
                <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                <input type="password" class="form-control" id="confirmPassword" class= "form-control" placeholder="Подтвердите пароль" required>
                <div id="passwordError" class="text-danger small mt-1" ></div>
            </div>

            
            <div class="col-12 mt-3">
                <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
                <label class="form-check-label" for="invalidCheck2">
                    Соглашаюсь с условиями
                </label>
                </div>
            </div>

            <div class="col-12">
               <button class="btn btn-primary" type="submit">Отправить</button>
            </div>
    </form>

  </div>
</main>
